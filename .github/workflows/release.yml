name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Run tests
        run: |
          go test -count=1 -timeout 120s ./...
      - name: Check coverage
        run: |
          go test -count=1 -coverprofile=coverage.out -timeout 120s ./...
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | sed 's/%//')
          echo "Coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 50" | bc -l)" = "1" ]; then
            echo "❌ Coverage below 50% threshold"
            exit 1
          fi

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          # GitHub Token — 用于创建 Release + 上传二进制
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Homebrew Tap Token — 用于推送 Formula 到 L00J/homebrew-tap
          # 设置方法:
          #   1. GitHub Settings → Developer settings → Personal access tokens → Fine-grained token
          #   2. Repository access: L00J/homebrew-tap (write)
          #   3. Permissions: Contents (read+write), Metadata (read)
          #   4. 将 token 添加到 L00J/opsxcli 仓库的 Secrets: HOMEBREW_TAP_TOKEN
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
