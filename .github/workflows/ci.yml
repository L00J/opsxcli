name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" .

      - name: Test
        run: go test -count=1 -timeout 120s ./...

      - name: Coverage
        run: |
          go test -count=1 -coverprofile=coverage.out -timeout 120s ./...
          go tool cover -func=coverage.out | tail -1
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | sed 's/%//')
          echo "## Coverage: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY
          if [ "$(echo "$COVERAGE < 50" | bc -l)" = "1" ]; then
            echo "❌ Coverage below 50%" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ Coverage above 50%" >> $GITHUB_STEP_SUMMARY

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
