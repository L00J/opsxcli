# .golangci.yml — opsxcli 代码质量配置
# 兼容 golangci-lint v2.x

version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocyclo
    - dupl
    - goconst
    - misspell
    - nakedret
    - prealloc
    - unconvert
    - whitespace
    - gosec
    - bodyclose
    - noctx
    - dogsled
    - gocritic
  settings:
    gocyclo:
      min-complexity: 20
    dupl:
      threshold: 150
    goconst:
      min-len: 3
      min-occurrences: 3
    misspell:
      locale: US
    nakedret:
      max-func-lines: 30
    gosec:
      excludes:
        - G104
    gocritic:
      enabled-tags:
        - performance
        - style
        - diagnostic
      disabled-checks:
        - wrapperFunc
        - dupImport
    errcheck:
      check-blank: false
    staticcheck:
      checks:
        - all
        - -SA1019
        - -SA4006

formatters:
  enable:
    - gofmt
    - goimports

severity:
  default: warning
  rules:
    - linters:
        - gosec
      severity: error
