# OpsXCLI GoReleaser 配置
# 发布策略: 预编译二进制 → GitHub Releases → Homebrew Formula 下载二进制（不放源码）
# 使用方式: goreleaser release --clean
#
# 发布流程:
#   1. 在 Gitee 开发完成后，push 到 GitHub + 打 tag
#   2. GitHub Actions 自动构建多平台二进制
#   3. 二进制上传到 GitHub Releases
#   4. Homebrew Formula 自动更新（只含二进制 URL + sha256）
#   5. 用户 brew tap L00J/tap && brew install opsxcli

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: opsxcli
    main: .
    binary: opsxcli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.buildTime={{.Date}}
      - -X main.gitCommit={{.Commit}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows arm64 暂时忽略
      - goos: windows
        goarch: arm64

archives:
  - id: opsxcli-archive
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - install.sh

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^auto:"
      - "^chore:"
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch
      - Revert

# Homebrew Tap — 只下载预编译二进制，不放源码 URL
# 关键: url_template 指向 GitHub Release 的 tar.gz（含编译好的二进制）
#        Formula 不需要 Go 编译环境，直接 bin.install 即可
brews:
  - name: opsxcli
    repository:
      owner: L00J
      name: homebrew-tap
      branch: main
      # 需要在 GitHub repo settings 中设置 HOMEBREW_TAP_TOKEN secret
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://gitee.com/opsx-tools/opsxcli"
    description: "OpsXCLI - DevOps CLI toolkit with 70+ commands, AI agent, TUI dashboard"
    license: MIT
    # 关键: 使用预编译二进制的下载 URL，而非源码 tarball
    url_template: "https://github.com/L00J/opsxcli/releases/download/{{ .Tag }}/{{ .ArchiveName }}"
    # 不需要 Go 编译环境 — 直接下载二进制
    install: |
      bin.install "opsxcli"
      # 安装 shell 补全脚本
      generate_completions_from_executable(bin/"opsxcli", "completion")
    test: |
      system "#{bin}/opsxcli", "--version"
    caveats: |
      OpsXCLI installed! Quick start:
        opsxcli              # Launch AI DevOps assistant
        opsxcli mysql        # MySQL client
        opsxcli redis        # Redis client
        opsxcli ssh          # SSH management
        opsxcli sys          # System monitoring TUI
        opsxcli --help       # Show all commands

release:
  github:
    owner: L00J
    name: opsxcli
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## OpsXCLI {{ .Tag }}

    ### 🚀 Quick Install

    **macOS (Homebrew)**:
    ```
    brew tap L00J/tap
    brew install opsxcli
    ```

    **Linux / macOS (script)**:
    ```
    curl -fsSL https://github.com/L00J/opsxcli/releases/latest/download/install.sh | bash
    ```

    **Manual download**: Pick the binary for your platform and architecture.

  footer: >-
    ---

    **Full changelog**: https://gitee.com/opsx-tools/opsxcli/blob/master/CHANGELOG.md
